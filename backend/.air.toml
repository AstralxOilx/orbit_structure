root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/orbit-api.exe ./cmd/api"
bin = "./tmp/orbit-api.exe"
full_bin = ""
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
